defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - lr_monitor
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: null
  monitor: null  # 監視するメトリックを指定しない
  verbose: False
  save_last: True  # 最後のチェックポイントを保存
  save_top_k: 0    # ベストモデルの保存を無効化
  mode: "min"
  auto_insert_metric_name: False
  save_weights_only: False

early_stopping:
  monitor: "val/loss"
  patience: 100
  mode: "min"

model_summary:
  max_depth: -1
