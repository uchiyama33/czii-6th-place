defaults:
  - criterion_seg: dice
  - criterion_map: bce

_target_: src.models.czii_module.CZIILitModule

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.001
  weight_decay: 1e-3
  
optimize_config:
  mode: normal

scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 5
  num_training_steps: ${trainer.max_epochs}

net:
  _target_: src.models.components.timm_2_5d_unet.Net
  model_name: tf_efficientnet_b0_ns
  num_classes: 7
  pretrained: true

# compile model for faster training with pytorch 2.0
compile: false