# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: czii
  - override /model: timm_2_5d_unet_hengck23_classmap
  - override /model/criterion_classmap: tversky07

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  pretrained_ckpt_path: /workspace/logs/train/runs/241201-my_sim_241130-seg_dice-hengck23_resnet34d_bn_relu_d32_512-s64_128-ep300-transV4/checkpoints/fold0_epoch_299.ckpt
  eval_normalize: true
  scheduler:
    num_warmup_steps: 20
  optimizer:
    lr: 1e-3
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    model_name: resnet34d
    grad_checkpointing: true
    decoder_dim: [512, 256, 128, 64, 32]
    output_classmap: true
    output_seg: false
    output_det: false
    norm_decoder: bn
    act_decoder: relu

data:
  volume_size: [64, 128, 128]
  batch_size: 8
  num_crop_samples: 1  # 増やすと1コアでの処理時間が増える
  transforms_version: 2.2
  num_repeats_train: 8

trainer:
  max_epochs: 300
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 10

experiment_name: 241201-classmap_tversky07-pretrained_my_sim_241130_299-hengck23_resnet34d_bn_relu_d32_512-s64_128-lr1e-3-ep300-transV2_2
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
