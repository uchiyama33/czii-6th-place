# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  # - override /callbacks: default_saveLast
  - override /data: czii
  - override /model: monai_unet_classmap
  - override /model/criterion_classmap: focalTverskyPp_07_20_13

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  pretrained_ckpt_path: /workspace/logs/train/runs/241212-my_sim_241205-classmap_focalTverskyPp_07_20_13-monai_unet_d32_512_res1_head1_bn-s64_128-lr1e-3-grad1-bs4_2_2-ep300-transV1-preV1/checkpoints/fold0_epoch_299.ckpt
  remove_pretrained_head: false
  num_classes: ${data.num_classes}
  preprocess_version: ${data.preprocess_version}
  eval_normalize: true
  scheduler:
    num_warmup_steps: 10
  optimizer:
    lr: 1e-3
    # weight_decay: 1e-6
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    num_classes: ${data.num_classes}
    in_chans: 2
    channels: [32, 64, 128, 256, 512]
    output_classmap: true
    output_seg: false
    output_det: false
    num_res_units: 1
    norm: batch
    num_head_layers: 1
    norm_head: bn
  # criterion_seg:
  #   include_background: false

data:
  volume_size: [64, 128, 128]
  batch_size: 4
  num_crop_samples: 2
  transforms_version: 1
  preprocess_version: 1

trainer:
  max_epochs: 100
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 5
  # gradient_clip_val: 1.0 

experiment_name: 241212-classmap_focalTverskyPp_07_20_13-pretrained_my_sim_241205_299_wHead-monai_unet_d32_512_res1_head1_bn-s64_128-lr1e-3-bs4_2_2-ep100-transV1-preV1
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
