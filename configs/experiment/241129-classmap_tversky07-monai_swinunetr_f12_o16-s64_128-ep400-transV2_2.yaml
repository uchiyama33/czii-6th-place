# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: czii
  - override /model: monai_swinunetr_classmap
  - override /model/criterion_classmap: tversky07

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  eval_normalize: true
  scheduler:
    num_warmup_steps: 10
  optimizer:
    lr: 1e-3
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    num_classes: 6
    feature_size: 12
    out_channels: 16
    output_classmap: true
    output_seg: false
    output_det: false
    norm_head: bn
    act_head: relu

data:
  volume_size: [64, 128, 128]
  batch_size: 1
  num_crop_samples: 1  # 増やすと1コアでの処理時間が増える
  transforms_version: 2.2
  num_repeats_train: 8

trainer:
  max_epochs: 400
  accumulate_grad_batches: 8
  check_val_every_n_epoch: 10

experiment_name: 241129-classmap_tversky07-monai_swinunetr_f12_o16-s64_128-ep400-transV2_2
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
