# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /callbacks: default_save20ep
  - override /data: czii_my_sim
  - override /model: timm_2_5d_unet_hengck23_v3_classmap
  - override /model/criterion_classmap: focalTverskyPp_07_20_13

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  is_kaggle_data: false
  num_classes: ${data.num_classes}
  preprocess_version: ${data.preprocess_version}
  eval_normalize: true
  scheduler:
    num_warmup_steps: 10
  optimizer:
    lr: 1e-3
    # weight_decay: 1e-6
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    pretrained: false
    num_classes: ${data.num_classes}
    in_chans: 1
    model_name: tf_efficientnetv2_b2.in1k
    grad_checkpointing: true
    decoder_dim: [256, 128, 64, 64, 64]
    output_classmap: true
    output_seg: false
    output_det: false
    norm_decoder: bn
    act_decoder: relu
    num_middle_conv: 2
    num_head_layers: 0
  # criterion_seg:
  #   include_background: false

data:
  data_dir: ${paths.data_dir}/my_sim_241221
  num_classes: 16
  volume_size: [64, 128, 128]
  batch_size: 4
  num_crop_samples: 2
  transforms_version: 3
  preprocess_version: 4.1
  num_workers: 12

trainer:
  max_epochs: 300
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 10
  gradient_clip_val: 1.0 

experiment_name: 250106-my_sim_241221-focalTverskyPp-hengck23_v3_env2b2_m2_d64_256_scratch-s64_128-scratch-lr1e-3-grad1-bs4_2_2-ep300-transV3-preV4_1
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
