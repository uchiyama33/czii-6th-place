# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  # - override /callbacks: default_saveLast
  - override /data: czii
  - override /model: timm_2_5d_unet_hengck23_classmap
  - override /model/criterion_classmap: focal_2
  - override /model/criterion_seg: tversky07

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  num_classes: ${data.num_classes}
  preprocess_version: ${data.preprocess_version}
  eval_normalize: true
  scale_factor_focal_loss: 10
  scheduler:
    num_warmup_steps: 5
  optimizer:
    lr: 1e-3
    # weight_decay: 1e-6
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    num_classes: ${data.num_classes}
    in_chans: 1
    model_name: resnet34d
    grad_checkpointing: true
    decoder_dim: [256, 128, 64, 64, 64]
    output_classmap: true
    output_seg: true
    output_det: false
    norm_decoder: bn
    act_decoder: relu
    num_head_layers: 0
  # criterion_seg:
  #   include_background: false

data:
  volume_size: [64, 128, 128]
  batch_size: 4
  num_crop_samples: 2
  transforms_version: 1
  preprocess_version: 2

trainer:
  max_epochs: 100
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 5
  gradient_clip_val: 1.0 

experiment_name: 241209-classmap_focal_2_s10-seg_tversky07-hengck23_resnet34d_d64_256-s64_128-lr1e-3-bs4_2_2-ep100-transV1-preV2
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
