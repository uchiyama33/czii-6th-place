# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /callbacks: default_save20ep
  - override /data: czii_my_sim
  - override /model: timm_2_5d_unet_hengck23_seg
  - override /model/criterion_seg: dice

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  is_kaggle_data: false
  num_classes: ${data.num_classes}
  eval_normalize: true
  scheduler:
    num_warmup_steps: 10
  optimizer:
    lr: 1e-3
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    model_name: resnet34d
    grad_checkpointing: true
    decoder_dim: [512, 256, 128, 64, 32]
    output_classmap: false
    output_seg: true
    output_det: false
    norm_decoder: bn
    act_decoder: relu

data:
  volume_size: [64, 128, 128]
  batch_size: 8
  num_crop_samples: 1  # 増やすと1コアでの処理時間が増える
  transforms_version: 4

trainer:
  max_epochs: 300
  accumulate_grad_batches: 2
  check_val_every_n_epoch: 10

experiment_name: 241201-my_sim_241130-seg_dice-hengck23_resnet34d_bn_relu_d32_512-s64_128-ep300-transV4
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
