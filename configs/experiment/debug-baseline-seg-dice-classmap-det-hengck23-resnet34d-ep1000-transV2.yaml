# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: czii
  - override /model: timm_2_5d_unet_hengck23_seg
  - override /model/criterion_seg: dice
  - override /model/criterion_classmap: bce
  - override /model/criterion_det: bce

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["baseline"]

callbacks:
  early_stopping:
    patience: ${trainer.max_epochs}

model:
  scheduler:
    num_warmup_steps: 30
  optimizer:
    lr: 1e-3
  # optimize_config:
  #   mode: target_decay
  #   target_name: net.encoder
  #   lr_base: ${model.optimizer.lr}
  #   lr_decay_coef: 0.1
  net:
    model_name: resnet34d
    grad_checkpointing: false
    decoder_dim: [256, 128, 64, 32, 16]
    output_classmap: true
    output_seg: true
    output_det: true

data:
  batch_size: 1
  transforms_version: 2

trainer:
  max_epochs: 1000
  accumulate_grad_batches: 2

experiment_name: debug-baseline-seg-dice-classmap-det-hengck23-resnet34d-ep1000-transV2
logger:
  wandb:
    tags: ${tags}
    name: ${experiment_name}-fold${data.fold}
log_dir: ${paths.log_dir}/${task_name}/runs/${experiment_name}
hydra:
  run:
    dir: ${log_dir}
